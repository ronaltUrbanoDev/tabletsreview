<!DOCTYPE html>
<html>
<head>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background: black;
    }
    #background {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #overlay img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div id="background">
  <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/7110oQdXKCBofaBanEYo1Z?utm_source=generator" width="100%" height="100%" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
</div>

<div id="overlay">
  <img id="slide" src="https://via.placeholder.com/1200x800?text=Propaganda+1">
</div>

<script>
  const imagens = [
    "https://via.placeholder.com/1200x800?text=Propaganda+1",
    "https://via.placeholder.com/1200x800?text=Propaganda+2",
    "https://via.placeholder.com/1200x800?text=Promoção+do+dia"
  ];
  let index = 0;
  const img = document.getElementById("slide");

  setInterval(() => {
    index = (index + 1) % imagens.length;
    img.src = imagens[index];
  }, 10000);
</script>

</body>
</html>
